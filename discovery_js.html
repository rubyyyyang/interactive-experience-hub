    <script>

      // Application state
      let CURRENT_PAGE = 1;
      let CURRENT_RESULTS = [];
      let CURRENT_PAGE_RECORD_IDS = [];
      let TOTAL_PAGES = 0;
      let FILTER_OPTIONS = {};
      let INITIAL_RESULTS = null;
      const RECORD_CACHE = new Map();
      
      
      
      // DOM Element Cache - Performance optimization
      const DOM_CACHE = {};
      function getCachedElement(id) {
        if (!DOM_CACHE[id]) {
          DOM_CACHE[id] = document.getElementById(id);
        }
        return DOM_CACHE[id];
      }

      // Selection state
      let SELECTION_MODE = false;
      let SELECTED_CARDS = new Set();
      let SELECTED_FORMAT = 'csv';

      // Search enhancement variables
      let searchTimeout;
      const SEARCH_DELAY = 320; // Reserved for future debounce behavior. Text search is manual Apply-only.
      const RESULTS_CACHE_TTL_MS = 300000;
      const RESULTS_CACHE_MAX_SIZE = 40;
      const RESULTS_CACHE = new Map();
      let searchCallCount = 0;
      let pendingSearches = [];
      let RESULTS_REQUEST_SEQ = 0;
      let LAST_RESULTS_REQUEST_KEY = "";
      let SEARCH_STATUS_HIDE_TIMER = null;
      let SEARCH_IS_LOADING = false;
      let FILTERS_HAVE_PENDING_CHANGES = false;
      
      // Recent searches configuration
      const RECENT_SEARCHES_KEY = 'eventArcadeRecentSearches';
      const MAX_RECENT_SEARCHES = 8;
      // Saved arcades configuration
      const SAVED_ARCADES_KEY = 'eventArcadeSavedArcades';
      let SAVED_ARCADES = new Set();
      let SYNONYM_MAP = {};

      var THEME_KEY = 'eventArcadeTheme';
      var THEME_CYCLE = ['system', 'light', 'dark'];
      var THEME_ICONS = { system: '☼', light: '☀', dark: '☽' };
      var THEME_LABELS = { system: 'System', light: 'Light', dark: 'Dark' };
      var CURRENT_THEME = 'system';

      function initTheme() {
        var saved = null;
        try { saved = localStorage.getItem(THEME_KEY); } catch(e) {}
        CURRENT_THEME = (saved && THEME_CYCLE.indexOf(saved) !== -1) ? saved : 'system';
        applyTheme_(CURRENT_THEME);
      }
      function cycleTheme() {
        var idx = THEME_CYCLE.indexOf(CURRENT_THEME);
        var next = THEME_CYCLE[(idx + 1) % THEME_CYCLE.length];
        CURRENT_THEME = next;
        applyTheme_(next);
        try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
        showInfo('Theme: ' + THEME_LABELS[next], 'Theme');
        trackEvent('theme_change', { theme: next });
      }
      function applyTheme_(theme) {
        var resolved = theme;
        if (theme === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        var iconEl = document.getElementById('themeIcon');
        if (iconEl) iconEl.textContent = THEME_ICONS[theme] || THEME_ICONS.system;
        var btn = document.getElementById('themeToggleBtn');
        var nextIdx = (THEME_CYCLE.indexOf(theme) + 1) % THEME_CYCLE.length;
        if (btn) btn.title = 'Current: ' + THEME_LABELS[theme] + ' · Click for ' + THEME_LABELS[THEME_CYCLE[nextIdx]];
      }

      const FILTER_DEFS = [
        { key: "formats", label: "Type", placeholder: "All types" },
        { key: "products", label: "Product", placeholder: "All products" },
        { key: "tdps", label: "TDP", placeholder: "All TDPs" },
        { key: "salesTactics", label: "Sales Tactic", placeholder: "All tactics" },
        { key: "marketingPrograms", label: "Marketing Program", placeholder: "All programs" },
        { key: "creatorNames", label: "Creator", placeholder: "All creators" },
      ];

      const filterState = {
        formats: [],
        products: [],
        creatorNames: [],
        tdps: [],
        marketingPrograms: [],
        salesTactics: [],
      };

      function buildFilterStateObject_() {
        var state = {};
        var q = (getCachedElement('globalSearch') || {}).value || '';
        if (q.trim()) state.q = q.trim();
        FILTER_DEFS.forEach(function(def) {
          var vals = filterState[def.key] || [];
          if (vals.length) state[def.key] = vals.join(',');
        });
        if (CURRENT_PAGE > 1) state.page = String(CURRENT_PAGE);
        return state;
      }

      function pushFilterStateToHash_(usePushState) {
        var state = buildFilterStateObject_();
        var parts = [];
        for (var k in state) {
          if (state.hasOwnProperty(k)) parts.push(k + '=' + encodeURIComponent(state[k]));
        }
        var hashStr = parts.join('&');
        try {
          if (typeof google !== 'undefined' && google.script && google.script.history) {
            if (usePushState) {
              google.script.history.push(state, {}, hashStr);
            } else {
              google.script.history.replace(state, {}, hashStr);
            }
          }
        } catch(e) {}
      }

      function restoreFilterStateFromLocation_() {
        try {
          if (typeof google !== 'undefined' && google.script && google.script.url) {
            google.script.url.getLocation(function(location) {
              var hash = location.hash || '';
              if (!hash) return;
              var params = {};
              hash.split('&').forEach(function(pair) {
                var kv = pair.split('=');
                if (kv.length === 2) params[kv[0]] = decodeURIComponent(kv[1]);
              });
              applyStateParams_(params);
            });
          }
        } catch(e) {}
      }

      function applyStateParams_(params) {
        if (!params) return false;
        var applied = false;
        if (params.q) {
          var el = getCachedElement('globalSearch');
          if (el) { el.value = params.q; applied = true; }
        }
        FILTER_DEFS.forEach(function(def) {
          if (params[def.key]) {
            filterState[def.key] = params[def.key].split(',');
            applied = true;
          }
        });
        if (params.page) CURRENT_PAGE = parseInt(params.page, 10) || 1;
        if (applied) {
          renderTopFilters(FILTER_OPTIONS);
          reloadResults(CURRENT_PAGE);
        }
        return applied;
      }

      // Analytics tracking
      var SESSION_ID = Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
      var ACTIVE_USER_EMAIL = '';

      function trackEvent(eventType, data = {}) {
        try {
          if (typeof google !== 'undefined' && google.script && google.script.run) {
            const eventData = {
              type: eventType,
              timestamp: new Date().toISOString(),
              sessionId: SESSION_ID,
              user: data.user || ACTIVE_USER_EMAIL,
              ...data
            };

            google.script.run
              .withFailureHandler((error) => {
                console.warn('Analytics tracking failed:', error);
              })
              .recordAnalyticsEvent(eventData);
          }
        } catch (error) {
          console.warn('Analytics tracking error:', error);
        }
      }

      function trackIndividualArcade(eventType, recordId, additionalData = {}) {
        const record = getDiscoveryRecord(recordId);
        if (!record) {
          console.warn('Could not find record for analytics:', recordId);
          return;
        }

        trackEvent(eventType, {
          recordId: recordId,
          title: record.title || 'Unknown',
          product: record.product || '',
          tdp: record.tdp || '',
          creator: record.creatorName || '',
          marketingProgram: record.marketingProgram || '',
          salesTactic: record.salesTactic || '',
          event: record.event || '',
          ...additionalData
        });
      }

      // Custom Notification System (replaces alert() to avoid "embedded page says" messages)
      function showNotification(message, type = 'info', title = '', duration = 5000) {
        const container = document.getElementById('notificationContainer');
        const id = 'notification-' + Date.now() + Math.random().toString(36).substr(2, 9);
        
        // Determine notification details based on type
        let iconSvg = '';
        let notificationTitle = title;
        
        if (type === 'success') {
          notificationTitle = title || 'Success';
          iconSvg = `<svg class="notification-icon success" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>`;
        } else if (type === 'error') {
          notificationTitle = title || 'Error';
          iconSvg = `<svg class="notification-icon error" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
          </svg>`;
        } else if (type === 'warning') {
          notificationTitle = title || 'Warning';
          iconSvg = `<svg class="notification-icon warning" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>`;
        } else {
          notificationTitle = title || 'Information';
          iconSvg = `<svg class="notification-icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
          </svg>`;
        }
        
        // Create notification element
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.id = id;
        notification.innerHTML = `
          <div class="notification-header">
            ${iconSvg}
            <span class="notification-title">${notificationTitle}</span>
            <button class="notification-close" onclick="hideNotification('${id}')" title="Close">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="notification-message">${message}</div>
        `;
        
        // Add to container
        container.appendChild(notification);
        
        // Trigger animation
        setTimeout(() => {
          notification.classList.add('show');
        }, 100);
        
        // Auto-hide after duration
        if (duration > 0) {
          setTimeout(() => {
            hideNotification(id);
          }, duration);
        }
        
        return id;
      }

      function hideNotification(id) {
        const notification = document.getElementById(id);
        if (notification) {
          notification.classList.remove('show');
          setTimeout(() => {
            if (notification.parentNode) {
              notification.parentNode.removeChild(notification);
            }
          }, 300);
        }
      }

      // Convenience functions for different notification types
      function showSuccess(message, title = 'Success', duration = 4000) {
        return showNotification(message, 'success', title, duration);
      }

      function showError(message, title = 'Error', duration = 6000) {
        return showNotification(message, 'error', title, duration);
      }

      function showWarning(message, title = 'Warning', duration = 5000) {
        return showNotification(message, 'warning', title, duration);
      }

      function showInfo(message, title = 'Information', duration = 4000) {
        return showNotification(message, 'info', title, duration);
      }

            // Performance optimization: Memoized search highlighting
      const HIGHLIGHT_CACHE = new Map();
      const HIGHLIGHT_CACHE_MAX_SIZE = 500;
      
      function highlightSearchTermsMemoized(text, searchQuery, options = {}) {
        const rawQuery = (searchQuery || "").trim();
        if (!rawQuery) return escapeHtml(text);

        const allowShort = !!options.allowShort;
        if (!allowShort && rawQuery.length < 2) return escapeHtml(text);

        const cacheKey = `${text}|${rawQuery}|${allowShort ? 1 : 0}`;
        if (HIGHLIGHT_CACHE.has(cacheKey)) return HIGHLIGHT_CACHE.get(cacheKey);

        const result = highlightSearchTerms(text, rawQuery);
        if (HIGHLIGHT_CACHE.size >= HIGHLIGHT_CACHE_MAX_SIZE) {
          const firstKey = HIGHLIGHT_CACHE.keys().next().value;
          HIGHLIGHT_CACHE.delete(firstKey);
        }
        HIGHLIGHT_CACHE.set(cacheKey, result);
        return result;
      }
      function setSearchStatus_(state, message, options) {
        // Search status text is intentionally disabled.
      }

      function clearSearchStatus_() {
        // Search status text is intentionally disabled.
      }

      function setListLoading_(isLoading) {
        setResultsLoading(!!isLoading);
      }

      function setApplyButtonLoading_(isLoading) {
        SEARCH_IS_LOADING = !!isLoading;
        const btn = getCachedElement("applySearchBtn");
        if (!btn) return;
        btn.disabled = false;
        btn.innerText = isLoading ? "Searching..." : "Apply";
        btn.setAttribute("aria-busy", isLoading ? "true" : "false");
      }

      function buildSearchStatusMessage_(filters) {
        const q = (filters && filters.q ? filters.q : "").trim();
        let filterCount = 0;
        FILTER_DEFS.forEach(function(def) {
          filterCount += (filterState[def.key] || []).length;
        });

        if (q && filterCount) return 'Searching "' + q + '" with ' + filterCount + ' filter' + (filterCount === 1 ? '' : 's') + '...';
        if (q) return 'Searching "' + q + '"...';
        if (filterCount) return 'Applying ' + filterCount + ' filter' + (filterCount === 1 ? '' : 's') + '...';
        return "Loading all Demos...";
      }

      function markFiltersPending_() {
        FILTERS_HAVE_PENDING_CHANGES = true;
        const count = FILTER_DEFS.reduce(function(total, def) {
          return total + ((filterState[def.key] || []).length ? 1 : 0);
        }, 0);
      }

      function applySearchNow() {
        clearTimeout(searchTimeout);
        pendingSearches = [];
        FILTERS_HAVE_PENDING_CHANGES = false;
        const filters = getFilters(1);
        reloadResults(1);
      }
      // Manual search input handler. Typing does not trigger search automatically.
      function handleSearchInput() {
        clearTimeout(searchTimeout);
        pendingSearches = [];
        FILTERS_HAVE_PENDING_CHANGES = true;

        const query = document.getElementById("globalSearch").value.trim();

        // Handle recent searches dropdown only. Do not run search while typing.
        if (query.length >= 6 || (query.length > 0 && query.endsWith(' '))) {
          showRecentSearchesFiltered(query);
        } else {
          hideRecentSearches();
        }
      }

      function handleSearchKeydown(event) {
        if (!event) return;
        if (event.key === "Enter") {
          event.preventDefault();
          applySearchNow();
        }
      }

      // Debounced Search Function with Advanced Operators. Currently unused because text search is Apply-only.
      function debouncedSearch() {
        clearTimeout(searchTimeout);
        
        const query = getCachedElement("globalSearch").value.trim();

        // Avoid expensive one-character searches. Empty search still reloads all results.
        if (query.length === 1) {
          return;
        }
        
        // Add to pending searches for batching
        pendingSearches.push({
          query: query,
          timestamp: Date.now()
        });
        
        searchTimeout = setTimeout(() => {
          // Process the most recent search from the batch
          const latestSearch = pendingSearches[pendingSearches.length - 1];
          const batchSize = pendingSearches.length;
          pendingSearches = []; // Clear the batch
          
          searchCallCount++;
          console.log(`🚀 Search #${searchCallCount} executing (batched ${batchSize} requests)`);
          
          if (latestSearch.query.length >= 6) {
            addToRecentSearches(latestSearch.query);
          }
          
          FILTERS_HAVE_PENDING_CHANGES = false;
          reloadResults(1);
        }, SEARCH_DELAY);
        
        console.log("🔍 Search debounced - timer reset");
      }


      function getCachedResults_(requestKey) {
        const cached = RESULTS_CACHE.get(requestKey);
        if (!cached) return null;
        if (Date.now() - cached.timestamp > RESULTS_CACHE_TTL_MS) {
          RESULTS_CACHE.delete(requestKey);
          return null;
        }
        return cached.value;
      }

      function putCachedResults_(requestKey, value) {
        if (!requestKey || !value) return;
        if (RESULTS_CACHE.size >= RESULTS_CACHE_MAX_SIZE) {
          const firstKey = RESULTS_CACHE.keys().next().value;
          RESULTS_CACHE.delete(firstKey);
        }
        RESULTS_CACHE.set(requestKey, {
          timestamp: Date.now(),
          value: value,
        });
      }

      function clearResultsCache_() {
        RESULTS_CACHE.clear();
        LAST_RESULTS_REQUEST_KEY = "";
      }

      function escapeHtml(str){
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeAttr(str){ return escapeHtml(str); }
      function cssEscape(value){
        if (window.CSS && typeof window.CSS.escape === "function") return window.CSS.escape(String(value || ""));
        return String(value || "").replace(/(["\\.#:\[\]\(\)\s>+~'=])/g, "\\$1");
      }

function getSortPriority(item) {
  if (item.discoverStatus === "Featured + Latest" || item.discoverStatus === "Featured") return 1;
  return 99;
}

      // Safe Search Highlighting Function
      function highlightSearchTerms(text, searchQuery) {
        if (!searchQuery || !searchQuery.trim()) {
          return escapeHtml(text);
        }

        const safeText = escapeHtml(text);
        const safeTerm = searchQuery.trim().toLowerCase();

        if (safeTerm.length < 2) {
          return safeText;
        }

        const escapedTerm = safeTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${escapedTerm})`, 'gi');

        return safeText.replace(regex, '<span class="search-highlight">$1</span>');
      }

      // LocalStorage Management for Recent Searches
      function getRecentSearches() {
        try {
          const stored = localStorage.getItem(RECENT_SEARCHES_KEY);
          return stored ? JSON.parse(stored) : [];
        } catch (e) {
          console.warn("Could not load recent searches:", e);
          return [];
        }
      }

      function addToRecentSearches(query) {
        if (!query || query.trim().length < 6) return;
        
        const searches = getRecentSearches();
        const trimmedQuery = query.trim();
        
        const index = searches.indexOf(trimmedQuery);
        if (index > -1) {
          searches.splice(index, 1);
        }
        
        searches.unshift(trimmedQuery);
        const recentSearches = searches.slice(0, MAX_RECENT_SEARCHES);
        
        try {
          localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(recentSearches));
          console.log("Saved recent search:", trimmedQuery);
        } catch (e) {
          console.warn("Could not save recent search:", e);
        }
      }

      // Recent Searches UI Functions
      function showRecentSearches() {
        const dropdown = document.getElementById('recentSearchesDropdown');
        const searches = getRecentSearches();
        
        if (searches.length === 0) {
          dropdown.classList.remove('show');
          return;
        }
        
        const html = searches.map(search => `
          <div class="recent-search-item" onclick="selectRecentSearch('${escapeAttr(search)}')">
            <span class="recent-search-icon">⏱</span>
            <span>${escapeHtml(search)}</span>
          </div>
        `).join('') + `
          <div class="recent-search-item" onclick="clearRecentSearches()" style="border-top: 1px solid #e5e7eb; color: #ef4444; font-size: 12px;">
            <span class="recent-search-icon">×</span>
            <span>Clear search history</span>
          </div>
        `;
        
        dropdown.innerHTML = html;
        dropdown.classList.add('show');
        console.log("Showing recent searches:", searches);
      }

      // Filtered recent searches based on current input
      function showRecentSearchesFiltered(currentQuery) {
        const dropdown = document.getElementById('recentSearchesDropdown');
        const allSearches = getRecentSearches();
        
        if (allSearches.length === 0) {
          dropdown.classList.remove('show');
          return;
        }
        
        // Filter searches based on current input
        const filtered = allSearches.filter(search => {
          if (!currentQuery || currentQuery.trim().length === 0) {
            return true; // Show all if no input
          }
          
          const query = currentQuery.trim().toLowerCase();
          const searchLower = search.toLowerCase();
          
          // Show if search starts with current input or contains it as a word
          return searchLower.startsWith(query) || searchLower.includes(' ' + query);
        });
        
        if (filtered.length === 0) {
          dropdown.classList.remove('show');
          return;
        }
        
        const html = filtered.map(search => `
          <div class="recent-search-item" onclick="selectRecentSearch('${escapeAttr(search)}')">
            <span class="recent-search-icon">⏱</span>
            <span>${escapeHtml(search)}</span>
          </div>
        `).join('') + `
          <div class="recent-search-item" onclick="clearRecentSearches()" style="border-top: 1px solid #e5e7eb; color: #ef4444; font-size: 12px;">
            <span class="recent-search-icon">×</span>
            <span>Clear search history</span>
          </div>
        `;
        
        dropdown.innerHTML = html;
        dropdown.classList.add('show');
        console.log("Showing filtered recent searches:", filtered);
      }

      function hideRecentSearches() {
        setTimeout(() => {
          document.getElementById('recentSearchesDropdown').classList.remove('show');
        }, 200);
      }

      function selectRecentSearch(search) {
        document.getElementById('globalSearch').value = search;
        hideRecentSearches();
        debouncedSearch();
        console.log("Selected recent search:", search);
      }

      function clearRecentSearches() {
        try {
          localStorage.removeItem(RECENT_SEARCHES_KEY);
          hideRecentSearches();
          console.log("Cleared all recent searches");
        } catch (e) {
          console.warn("Could not clear recent searches:", e);
        }
      }

      // Saved Arcades LocalStorage Functions
      function loadSavedArcades() {
        try {
          const stored = localStorage.getItem(SAVED_ARCADES_KEY);
          if (stored) {
            const arcadeArray = JSON.parse(stored);
            SAVED_ARCADES = new Set(arcadeArray);
            console.log(`Loaded ${SAVED_ARCADES.size} saved arcades`);
          }
        } catch (e) {
          console.warn("Could not load saved arcades:", e);
          SAVED_ARCADES = new Set();
        }
        updateSavedArcadesCounter();
      }

      function saveSavedArcades() {
        try {
          const arcadeArray = Array.from(SAVED_ARCADES);
          localStorage.setItem(SAVED_ARCADES_KEY, JSON.stringify(arcadeArray));
          console.log(`Saved ${arcadeArray.length} arcades to localStorage`);
        } catch (e) {
          console.warn("Could not save arcades:", e);
        }
      }


      function toggleSavedArcade(recordId) {
        if (SAVED_ARCADES.has(recordId)) {
          SAVED_ARCADES.delete(recordId);
          trackIndividualArcade('unsave_demo', recordId);
          showInfo('Demo removed from saved list.', 'Removed');
        } else {
          SAVED_ARCADES.add(recordId);
          trackIndividualArcade('save_demo', recordId);
          showSuccess('Demo saved! Access it from Saved Demos.', 'Saved');
        }
        saveSavedArcades();
        updateSavedArcadesCounter();
        syncCardBookmarkIcons_();
        renderSavedArcadesList();
      }

      function syncCardBookmarkIcons_() {
        document.querySelectorAll('.card .btn.icon-only').forEach(function(btn) {
          var onclick = btn.getAttribute('onclick') || '';
          var m = onclick.match(/toggleSavedArcade\('([^']+)'\)/);
          if (!m) return;
          var rid = m[1];
          var saved = SAVED_ARCADES.has(rid);
          btn.classList.toggle('saved', saved);
          btn.title = saved ? 'Saved' : 'Save Demo';
          var svg = btn.querySelector('svg');
          if (svg) svg.setAttribute('fill', saved ? 'currentColor' : 'none');
        });
      }

      function clearAllSavedArcades() {
        if (SAVED_ARCADES.size === 0) {
          showInfo("No saved demos to clear.", "Already Empty");
          return;
        }

        const count = SAVED_ARCADES.size;
        if (confirm(`Are you sure you want to clear all ${count} saved demo${count !== 1 ? 's' : ''}?`)) {
          SAVED_ARCADES.clear();
          saveSavedArcades();
          updateSavedArcadesCounter();
          renderSavedArcadesList();
          showSuccess(`Cleared ${count} saved demo${count !== 1 ? 's' : ''}.`, "Cleared Successfully");
        }
      }

      function updateSavedArcadesCounter() {

async function copyText(text){
  const value = String(text || "")
    .replace(/&amp;/g, "&")
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">");

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(value);
    } else {
      throw new Error("Clipboard API unavailable");
    }
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = value;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-9999px";
    ta.style.left = "-9999px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);

    const ok = document.execCommand("copy");
    document.body.removeChild(ta);

    if (!ok) {
      showError("Copy failed. Please copy manually.", "Copy Failed");
      return false;
    }
  }

  showSuccess("Copied to clipboard!", "Success");
  return false;
}


      const BOOTSTRAP_CACHE_KEY = 'discovery_bootstrap_cache';
      const BOOTSTRAP_CACHE_MAX_AGE = 30 * 60 * 1000;

      function getCachedBootstrap_() {
        try {
          const raw = localStorage.getItem(BOOTSTRAP_CACHE_KEY);
          if (!raw) return null;
          const cached = JSON.parse(raw);
          if (Date.now() - (cached._ts || 0) > BOOTSTRAP_CACHE_MAX_AGE) {
            localStorage.removeItem(BOOTSTRAP_CACHE_KEY);
            return null;
          }
          return cached;
        } catch (e) { return null; }
      }

      function putCachedBootstrap_(bootstrap) {
        try {
          const toCache = {
            initial: bootstrap.initial,
            filterOptions: bootstrap.filterOptions,
            synonymMap: bootstrap.synonymMap,
            _ts: Date.now(),
          };
          localStorage.setItem(BOOTSTRAP_CACHE_KEY, JSON.stringify(toCache));
        } catch (e) {}
      }

      function applyBootstrapData_(bootstrap) {
        ACTIVE_USER_EMAIL = bootstrap?.me || ACTIVE_USER_EMAIL || '';
        INITIAL_RESULTS = bootstrap?.initial || {
          totalRows: 0, page: 1, pageSize: 20, totalPages: 0, items: [], tdpCounts: {}
        };
        if (bootstrap?.filterOptions) FILTER_OPTIONS = bootstrap.filterOptions;
        if (bootstrap?.synonymMap) SYNONYM_MAP = bootstrap.synonymMap;
        seedRecordCache(INITIAL_RESULTS.items || []);
        try {
          putCachedResults_(JSON.stringify({
            q: "", products: [], creatorNames: [], tdps: [],
            marketingPrograms: [], salesTactics: [], page: 1, pageSize: 20,
          }), INITIAL_RESULTS);
        } catch (e) {}
      }

      async function loadData() {
        const cached = getCachedBootstrap_();
        if (cached) {
          console.log('⚡ Using cached bootstrap');
          applyBootstrapData_(cached);
          loadSavedArcades();
          renderResults(INITIAL_RESULTS);
          if (FILTER_OPTIONS && Object.keys(FILTER_OPTIONS).length) {
            renderTopFilters(FILTER_OPTIONS);
          }
          refreshBootstrapInBackground_();
          return true;
        }

        try {
          return await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
              document.getElementById("summaryText").innerText = "Data loading timed out. Please refresh the page.";
              reject(new Error("Timeout"));
            }, 90000);

            google.script.run
              .withSuccessHandler((bootstrap) => {
                clearTimeout(timeout);
                try {
                  applyBootstrapData_(bootstrap);
                  putCachedBootstrap_(bootstrap);
                  resolve(true);
                } catch (error) {
                  reject(error);
                }
              })
              .withFailureHandler((error) => {
                clearTimeout(timeout);
                reject(error);
              })
              .getDiscoveryBootstrap();
          });
        } catch (error) {
          console.error("Failed to load data:", error);
          document.getElementById("summaryText").innerText = "Error loading data: " + (error.message || error);
          return false;
        }
      }

      function refreshBootstrapInBackground_() {
        google.script.run
          .withSuccessHandler((bootstrap) => {
            console.log('🔄 Background refresh complete');
            applyBootstrapData_(bootstrap);
            putCachedBootstrap_(bootstrap);
            renderResults(INITIAL_RESULTS);
            if (FILTER_OPTIONS && Object.keys(FILTER_OPTIONS).length) {
              renderTopFilters(FILTER_OPTIONS);
            }
          })
          .withFailureHandler((err) => console.warn('Background refresh failed:', err))
          .getDiscoveryBootstrap();

      function seedRecordCache(items) {
        (items || []).forEach((item) => {
          if (item && item.recordId) {
            RECORD_CACHE.set(String(item.recordId), item);
          }
        });
      }

      function getDiscoveryRecord(recordId) {
        return RECORD_CACHE.get(String(recordId)) || null;
      }

      async function fetchRecordById(recordId) {
        const cacheKey = String(recordId);
        const cached = RECORD_CACHE.get(cacheKey);
        if (cached) return cached;

        return await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler((record) => {
              if (record && record.recordId) {
                RECORD_CACHE.set(String(record.recordId), record);
              }
              resolve(record || null);
            })
            .withFailureHandler(reject)
            .getDiscoveryRecord(cacheKey);
        });
      }

      async function fetchRecordsByIds(recordIds) {
        const uniqueIds = Array.from(new Set((recordIds || []).map(id => String(id)).filter(Boolean)));
        if (!uniqueIds.length) return [];

        const cached = [];
        const missing = [];
        uniqueIds.forEach((recordId) => {
          const rec = getDiscoveryRecord(recordId);
          if (rec) cached.push(rec);
          else missing.push(recordId);
        });

        if (!missing.length) return cached;

        const fetched = await Promise.all(missing.map((recordId) => fetchRecordById(recordId).catch(() => null)));
        return cached.concat(fetched.filter(Boolean));
      }

      function getMatchingTdpsByTopic(topicName) {
        const availableTdps = FILTER_OPTIONS.tdps || [];
        const matchingTdps = [];
        
        // Define TDP mapping for each topic
        const topicMappings = {
          'AI': ['AI Platform'],
          'Virtualization': ['Virtualization']
        };
        
        const targetTdps = topicMappings[topicName] || [];
        
        // Find matching TDPs
        for (const tdp of availableTdps) {
          for (const targetTdp of targetTdps) {
            if (tdp === targetTdp || tdp.toLowerCase().includes(targetTdp.toLowerCase())) {
              if (!matchingTdps.includes(tdp)) {
                matchingTdps.push(tdp);
              }
              break;
            }
          }
        }
        
        console.log(`Found ${matchingTdps.length} matching TDPs for "${topicName}":`, matchingTdps);
        return matchingTdps;
      }

      }


      function getMatchingProducts(baseProductName) {
        const availableProducts = FILTER_OPTIONS.products || [];
        const matchingProducts = [];
        
        // Define matching patterns for each base product
        const productPatterns = {
          'Red Hat Enterprise Linux': ['Enterprise Linux', 'RHEL', 'Red Hat Enterprise Linux'],
          'Red Hat OpenShift': ['OpenShift'],
          'Ansible Automation Platform': ['Ansible'],
          'OpenShift AI': ['OpenShift AI', 'AI']
        };
        
        const patterns = productPatterns[baseProductName] || [baseProductName];
        
        // Find all products that contain any of the patterns
        for (const product of availableProducts) {
          for (const pattern of patterns) {
            if (product.toLowerCase().includes(pattern.toLowerCase())) {
              // Special case: when selecting "Red Hat OpenShift", exclude OpenShift AI products
              if (baseProductName === 'Red Hat OpenShift' && 
                  (product.toLowerCase().includes('ai') || product.toLowerCase().includes('artificial'))) {
                break; // Skip this product
              }
              
              if (!matchingProducts.includes(product)) {
                matchingProducts.push(product);
              }
              break; // Found a match, no need to check other patterns for this product
            }
          }
        }
        
        console.log(`Found ${matchingProducts.length} matching products for "${baseProductName}":`, matchingProducts);
        return matchingProducts;
      }

      function reloadResultsWithCallback(callback, page){
        closeAllPickers();
        CURRENT_PAGE = page || 1;

        // Get filters for search
        const filters = getFilters(CURRENT_PAGE);
        const requestKey = JSON.stringify(filters);
        const cached = getCachedResults_(requestKey);
        if (cached) {
          LAST_RESULTS_REQUEST_KEY = requestKey;
          FILTERS_HAVE_PENDING_CHANGES = false;
          renderResults(cached);
          setResultsLoading(false);
          setApplyButtonLoading_(false);
          clearSearchStatus_();
          if (callback) callback();
          return;
        }

        if (requestKey === LAST_RESULTS_REQUEST_KEY && !callback && !FILTERS_HAVE_PENDING_CHANGES) {
          clearSearchStatus_();
          return;
        }
        LAST_RESULTS_REQUEST_KEY = requestKey;

        const requestSeq = ++RESULTS_REQUEST_SEQ;
        FILTERS_HAVE_PENDING_CHANGES = false;
        pushFilterStateToHash_(false);
        setApplyButtonLoading_(true);
        setListLoading_(true);

        // Avoid rebuilding skeleton DOM for every search. Keep existing cards visible and mark them busy.
        if (CURRENT_RESULTS && CURRENT_RESULTS.length) {
          setResultsLoading(true);
        } else {
          renderSkeletonCards(8);
          setResultsLoading(true);
        }
        
        // Defer analytics tracking to not slow down UI updates
        if (CURRENT_PAGE === 1) {
          setTimeout(() => {
            try {
              const query = (filters.q || '').trim();
              if (query.length >= 3) {
                trackEvent('search', { query: query });
              }
              var activeFilters = {};
              FILTER_DEFS.forEach(function(def) {
                var vals = filterState[def.key] || [];
                if (vals.length) activeFilters[def.key] = vals.join(',');
              });
              if (Object.keys(activeFilters).length) {
                trackEvent('filter_applied', activeFilters);
              }
            } catch (e) {
              console.warn('Analytics tracking error:', e);
            }
          }, 100);
        }

        google.script.run
          .withSuccessHandler((res) => {
            if (requestSeq !== RESULTS_REQUEST_SEQ) return;
            try {
              seedRecordCache((res && res.items) || []);
            } catch (e) {
              console.warn("Failed to seed record cache:", e);
            }
            putCachedResults_(requestKey, res);
            renderResults(res);
            setResultsLoading(false);
            setApplyButtonLoading_(false);
            if (callback) callback();
          })
          .withFailureHandler((error) => {
            if (requestSeq !== RESULTS_REQUEST_SEQ) return;
            console.error('Search failed:', error);
            getCachedElement("summaryText").innerText = "Search failed: " + (error.message || error);
            setResultsLoading(false);
            setApplyButtonLoading_(false);
            if (callback) callback();
          })
          .listDiscoveryPage(filters);
      }

      function renderResults(res){
        setResultsLoading(false);
        const items = res.items || [];
        CURRENT_RESULTS = items.slice();
        CURRENT_PAGE_RECORD_IDS = items.map(item => String(item.recordId)).filter(Boolean);
        try { seedRecordCache(items); } catch (e) { console.warn("Failed to seed record cache during render:", e); }
        getCachedElement("summaryText").innerText = `${res.totalRows || 0} Demos found`;

        renderTdpCounts(res.tdpCounts || {});
        renderPager(res);

        const currentSearchQuery = getCachedElement("globalSearch").value.trim();

        if (!res.items || !res.items.length){
          setResultsLoading(false);
          renderEmptyState(currentSearchQuery, filterState);
          return;
        }

        renderResultsChunked(res.items || [], currentSearchQuery);
      }

      function renderEmptyState(query, activeFilters) {
        var resultsEl = getCachedElement("results");
        var html = '<div class="emptyState">';
        html += '<div class="emptyStateTitle">No Demos found</div>';

        var synonym = getSynonymSuggestion_(query);
        if (synonym) {
          html += '<div class="emptyStateSuggestion">Did you mean <a onclick="applySynonymSearch(\'' + synonym.replace(/'/g, "\\'") + '\')">' + synonym + '</a>?</div>';
        }

        var activeKeys = getActiveFilterKeys_(activeFilters);
        if (activeKeys.length > 0) {
          html += '<div class="emptyStateFilterHint">Try removing ';
          activeKeys.forEach(function(k, i) {
            if (i > 0) html += ' or ';
            html += '<a onclick="removeFilterAndReload(\'' + k + '\')">' + getFilterLabel_(k) + '</a>';
          });
          html += ' filter' + (activeKeys.length > 1 ? 's' : '') + '</div>';
        }

        html += '</div>';
        resultsEl.innerHTML = html;

        if (query) {
          trackEvent('zero_results', { query: query, filters: activeKeys.join(','), suggestion: synonym || '' });
        }

        fetchRelaxedResults_(query, activeFilters, resultsEl);
      }

      function getSynonymSuggestion_(query) {
        if (!query || !SYNONYM_MAP) return null;
        var tokens = query.toLowerCase().split(/\s+/);
        for (var i = 0; i < tokens.length; i++) {
          var expansions = SYNONYM_MAP[tokens[i]];
          if (expansions && expansions.length > 0) return expansions[0];
        }
        return null;
      }

      function getActiveFilterKeys_(filters) {
        var keys = [];
        if (!filters) return keys;
        for (var k in filters) {
          if (filters.hasOwnProperty(k) && filters[k] && filters[k].length > 0) keys.push(k);
        }
        return keys;
      }

      function getFilterLabel_(key) {
        for (var i = 0; i < FILTER_DEFS.length; i++) {
          if (FILTER_DEFS[i].key === key) return FILTER_DEFS[i].label;
        }
        return key;
      }

      function applySynonymSearch(term) {
        var el = getCachedElement('globalSearch');
        if (el) el.value = term;
        reloadResults(1);
      }

      function removeFilterAndReload(key) {
        filterState[key] = [];
        renderTopFilters(FILTER_OPTIONS);
        reloadResults(1);
      }

      function fetchRelaxedResults_(query, filters, containerEl) {
        var relaxedFilters = { q: query || '', products: [], creatorNames: [], tdps: [], marketingPrograms: [], salesTactics: [], page: 1, pageSize: 5 };
        var hasActiveFilters = getActiveFilterKeys_(filters).length > 0;
        if (!hasActiveFilters && !query) return;

        if (hasActiveFilters) {
          relaxedFilters.q = query || '';
        } else if (query) {
          var tokens = query.split(/\s+/);
          relaxedFilters.q = tokens[0];
        }

        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.items && res.items.length > 0) {
              var html = '<div class="emptyStateRelatedWrap">';
              html += '<div class="emptyStateRelatedLabel">Related demos</div>';
              html += '<div class="emptyStateRelatedGrid">';
              res.items.slice(0, 5).forEach(function(item) {
                html += renderCard(item, '');
              });
              html += '</div></div>';
              containerEl.innerHTML += html;
            }
          })
          .withFailureHandler(function() {})
          .listDiscoveryPage(relaxedFilters);
      }

      function exportAsCSV(records, options){
        const headers = ['Title', 'Product', 'Event', 'TDP', 'Marketing Program', 'Sales Tactic', 'Status'];
        
        if (options.includeDescription) headers.push('Description');
        if (options.includeCreatorInfo) headers.push('Creator Name', 'Creator Team', 'Creator Email');
        if (options.includeMetadata) headers.push('Language', 'Personas', 'Verticals');
        if (options.includeLinks) {
          headers.push('Primary Link');
          const hasProductionLinks = records.some(record => getExportLinks(record).showProduction && getExportLinks(record).productionLink);
          if (hasProductionLinks) headers.push('Production Link');
        }

        const csvRows = [headers.join(',')];
        
        records.forEach(record => {
          const row = [
            escapeCSV(record.title),
            escapeCSV(record.product),
            escapeCSV(record.event),
            escapeCSV(record.tdp),
            escapeCSV(record.marketingProgram),
            escapeCSV(record.salesTactic),
            escapeCSV(record.discoverStatus)
          ];
          
          if (options.includeDescription) row.push(escapeCSV(record.description));
          if (options.includeCreatorInfo) {
            row.push(escapeCSV(record.creatorName), escapeCSV(record.creatorTeam), escapeCSV(record.creatorEmail));
          }
          if (options.includeMetadata) {
            row.push(escapeCSV(record.language), escapeCSV(record.personas), escapeCSV(record.verticals));
          }
          if (options.includeLinks) {
            const linkInfo = getExportLinks(record);
            row.push(escapeCSV(linkInfo.primaryLink));
            
            const hasProductionLinks = records.some(r => getExportLinks(r).showProduction && getExportLinks(r).productionLink);
            if (hasProductionLinks) {
              row.push(escapeCSV(linkInfo.showProduction ? linkInfo.productionLink : ''));
            }
          }
          
          csvRows.push(row.join(','));
        });

        downloadFile(csvRows.join('\n'), 'demo-export.csv', 'text/csv');
      }

      function escapeCSV(value){
        if (value == null) return '';
        const str = String(value);
        if (str.includes(',') || str.includes('"') || str.includes('\n')) {
          return '"' + str.replace(/"/g, '""') + '"';
        }
        return str;
      }

      function downloadFile(content, filename, mimeType){
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      async function generateEventRequestEmail(eventName, eventDateRange, contactEmail, contactName, eventNotes) {
        const selectedRecords = await fetchRecordsByIds(Array.from(SELECTED_CARDS));

        // Show loading indicator
        const sendBtn = document.querySelector('.eventRequestActions .btn.success');
        const originalText = sendBtn.textContent;
        sendBtn.textContent = 'Sending...';
        sendBtn.disabled = true;

        // Build email request data
        const emailData = {
          eventName: eventName,
          eventDateRange: eventDateRange,
          contactEmail: contactEmail,
          contactName: contactName,
          eventNotes: eventNotes || 'No additional notes provided.',
          selectedRecords: selectedRecords,
          ccEmail: contactEmail
        };

        // Send email using Google Apps Script
        google.script.run
          .withSuccessHandler((result) => {
            // Track successful event request
            trackEvent('event_request_success', {
              eventName: eventName,
              selectedCount: selectedRecords.length,
              contactEmail: contactEmail,
              contactName: contactName,
              action: 'event_request_sent'
            });

            // Reset button state
            sendBtn.textContent = originalText;
            sendBtn.disabled = false;
            
            // Close modal and show success message
            closeEventRequestModal();
            showSuccess(`Event package request sent successfully to interactive-experiences@redhat.com!\n\nRequest: "${eventName}" with ${selectedRecords.length} selected demo${selectedRecords.length !== 1 ? 's' : ''}`, "Request Sent");
          })
          .withFailureHandler((error) => {
            console.error('Email send failed:', error);

            // Track failed event request
            trackEvent('event_request_failed', {
              eventName: eventName,
              selectedCount: selectedRecords.length,
              contactEmail: contactEmail,
              contactName: contactName,
              action: 'event_request_failed',
              errorMessage: error.message || error || 'Unknown error'
            });
            
            // Reset button state
            sendBtn.textContent = originalText;
            sendBtn.disabled = false;
            
            // Enhanced error handling for different types of Apps Script errors
            let errorMsg = 'Unknown error occurred';
            let showFallback = true;
            
            if (error) {
              if (typeof error === 'string') {
                errorMsg = error;
              } else if (error.message) {
                errorMsg = error.message;
              } else if (error.error) {
                errorMsg = error.error;
              } else if (error.name) {
                errorMsg = `${error.name}: ${error.message || 'Unknown error'}`;
              }
              
              // Handle specific Google Apps Script errors
              if (errorMsg.toLowerCase().includes('permission') || errorMsg.toLowerCase().includes('authorization')) {
                errorMsg = 'Permission denied. Please check if the Google Apps Script has proper Gmail permissions.';
                showFallback = false;
              } else if (errorMsg.toLowerCase().includes('quota') || errorMsg.toLowerCase().includes('limit')) {
                errorMsg = 'Email quota exceeded. Please try again later or contact your administrator.';
              } else if (errorMsg.toLowerCase().includes('timeout')) {
                errorMsg = 'Request timed out. The email may have been sent, please check your inbox.';
              }
            }
            
            // Show appropriate error message
            if (showFallback) {
              const retry = confirm(`Email sending failed: ${errorMsg}\n\nWould you like to copy the email content to your clipboard instead?`);
              if (retry) {
                buildAndCopyFallbackEmail();
              }
            } else {
              showError(`Email sending failed: ${errorMsg}\n\nPlease contact your system administrator or try again later.`, "Email Send Failed");
            }
            
            function buildAndCopyFallbackEmail() {
              // Build fallback email content
              const subject = `Event Package Request - ${eventName} (${selectedRecords.length} Demo${selectedRecords.length !== 1 ? 's' : ''})`;

              let demoList = '';
              selectedRecords.forEach((record, index) => {
                const primaryLink = getLaunchLink(record) || getEditLink(record);
                demoList += `${index + 1}. ${record.title || 'Untitled'}
   Product: ${record.product || 'N/A'}
   TDP: ${record.tdp || 'N/A'}
   Marketing Program: ${record.marketingProgram || 'N/A'}
   Sales Tactic: ${record.salesTactic || 'N/A'}
   Creator: ${record.creatorName || 'N/A'}
   ${primaryLink ? 'Link: ' + primaryLink : ''}

`;
              });

              const fallbackContent = `To: interactive-experiences@redhat.com
CC: ${contactName} <${contactEmail}>
Subject: ${subject}

Hello,

I would like to request an event package with the following details:

Event Information:
- Name: ${eventName}
- Date Range: ${eventDateRange}
- Contact Name: ${contactName}
- Contact Email: ${contactEmail}

Selected Demos (${selectedRecords.length} total):
${demoList}${eventNotes !== 'No additional notes provided.' ? `

Additional Notes:
${eventNotes}` : ''}

Thank you for your assistance in creating this event package.

Best regards,
${contactName}`;
              
              // Copy to clipboard
              navigator.clipboard.writeText(fallbackContent).then(() => {
                showSuccess('Email content copied to clipboard! Please paste it into your email client.', "Content Copied");
              }).catch((clipboardError) => {
                console.error('Clipboard copy failed:', clipboardError);
                showError('Could not copy to clipboard. Please manually send an email to interactive-experiences@redhat.com with your event details.', "Copy Failed");
              });
            }
          })
          .sendEventPackageRequest(emailData);
      }

      // Feedback Modal Functions
      function openFeedbackModal(){
        // Track feedback modal open
        trackEvent('feedback_modal_open', {
          action: 'modal_open'
        });
        
        document.getElementById("feedbackModal").classList.add("open");
      }

      function closeFeedbackModal(evt){
        if (evt && evt.target && evt.target.id !== "feedbackModal") return;
        
        // Track feedback modal close
        trackEvent('feedback_modal_close', {
          action: 'modal_close'
        });
        
        document.getElementById("feedbackModal").classList.remove("open");
        
        // Clear form fields when closing
        document.getElementById("feedbackType").value = "";
        document.getElementById("feedbackSubject").value = "";
        document.getElementById("feedbackMessage").value = "";
        document.getElementById("feedbackEmail").value = "";
      }

      function executeFeedbackSubmission(){
        // Validate required fields
        const feedbackType = document.getElementById("feedbackType").value.trim();
        const feedbackSubject = document.getElementById("feedbackSubject").value.trim();
        const feedbackMessage = document.getElementById("feedbackMessage").value.trim();
        const feedbackEmail = document.getElementById("feedbackEmail").value.trim();

        if (!feedbackType) {
          showError("Please select a feedback type.", "Type Required");
          document.getElementById("feedbackType").focus();
          return;
        }

        if (!feedbackSubject) {
          showError("Please enter a subject.", "Subject Required");
          document.getElementById("feedbackSubject").focus();
          return;
        }

        if (!feedbackMessage) {
          showError("Please enter your feedback message.", "Message Required");
          document.getElementById("feedbackMessage").focus();
          return;
        }

        // Validate email format if provided
        if (feedbackEmail) {
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(feedbackEmail)) {
            showError("Please enter a valid email address.", "Invalid Email");
            document.getElementById("feedbackEmail").focus();
            return;
          }
        }

        // Track feedback submission start
        trackEvent('feedback_start', {
          feedbackType: feedbackType,
          feedbackSubject: feedbackSubject,
          hasEmail: feedbackEmail ? true : false,
          action: 'feedback_initiate'
        });

        generateFeedbackEmail(feedbackType, feedbackSubject, feedbackMessage, feedbackEmail);
      }

      function generateFeedbackEmail(feedbackType, feedbackSubject, feedbackMessage, feedbackEmail) {
        // Show loading indicator
        const sendBtn = document.querySelector('#feedbackModal .eventRequestActions .btn.success');
        const originalText = sendBtn.textContent;
        sendBtn.textContent = 'Sending...';
        sendBtn.disabled = true;

        // Build email request data
        const emailData = {
          feedbackType: feedbackType,
          subject: feedbackSubject,
          message: feedbackMessage,
          email: feedbackEmail || 'Not provided',
          timestamp: new Date().toISOString(),
          userAgent: navigator.userAgent,
          url: window.location.href
        };

        // Send feedback using Google Apps Script
        google.script.run
          .withSuccessHandler((result) => {
            // Track successful feedback submission
            trackEvent('feedback_success', {
              feedbackType: feedbackType,
              feedbackSubject: feedbackSubject,
              hasEmail: feedbackEmail ? true : false,
              action: 'feedback_sent'
            });

            // Reset button state
            sendBtn.textContent = originalText;
            sendBtn.disabled = false;
            
            // Close modal and show success message
            closeFeedbackModal();
            showSuccess(`Feedback submitted successfully!\n\nThank you for helping us improve The Interact Hub.`, "Feedback Sent");
          })
          .withFailureHandler((error) => {
            console.error('Feedback submission failed:', error);

            // Track failed feedback submission
            trackEvent('feedback_failed', {
              feedbackType: feedbackType,
              feedbackSubject: feedbackSubject,
              hasEmail: feedbackEmail ? true : false,
              action: 'feedback_failed',
              errorMessage: error.message || error || 'Unknown error'
            });
            
            // Reset button state
            sendBtn.textContent = originalText;
            sendBtn.disabled = false;
            
            // Show error and provide fallback option
            const errorMsg = error.message || error || 'Unknown error';
            const retry = confirm(`Feedback submission failed: ${errorMsg}\n\nWould you like to copy the feedback content to your clipboard instead?`);
            
            if (retry) {
              // Build fallback email content
              const subject = `Feedback: ${feedbackType} - ${feedbackSubject}`;
              const fallbackContent = `To: feedback@example.com
Subject: ${subject}

Feedback Type: ${feedbackType}
Subject: ${feedbackSubject}
Contact Email: ${feedbackEmail || 'Not provided'}
Submitted: ${new Date().toLocaleString()}

Message:
${feedbackMessage}

---
Technical Details:
URL: ${window.location.href}
User Agent: ${navigator.userAgent}`;
              
              // Copy to clipboard
              navigator.clipboard.writeText(fallbackContent).then(() => {
                showSuccess('Feedback content copied to clipboard! Please paste it into your email client.', "Content Copied");
              }).catch((clipboardError) => {
                console.error('Clipboard copy failed:', clipboardError);
                showError('Could not copy to clipboard. Please manually send feedback via email.', "Copy Failed");
              });
            }
          })
          .submitFeedback(emailData);
      }

      // Resources Sidebar Functions
      let SIDEBAR_OPEN = false;

      function toggleResourcesSidebar() {
        SIDEBAR_OPEN = !SIDEBAR_OPEN;
        const sidebar = document.getElementById('resourcesSidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        
        if (SIDEBAR_OPEN) {
          sidebar.classList.add('open');
          if (window.innerWidth <= 768) {
            backdrop.classList.add('show');
            document.body.style.overflow = 'hidden';
          }
        } else {
          sidebar.classList.remove('open');
          backdrop.classList.remove('show');
          document.body.style.overflow = '';
        }
      }

      function closeResourcesSidebar() {
        if (SIDEBAR_OPEN) {
          SIDEBAR_OPEN = false;
          const sidebar = document.getElementById('resourcesSidebar');
          const backdrop = document.getElementById('sidebarBackdrop');
          
          sidebar.classList.remove('open');
          backdrop.classList.remove('show');
          document.body.style.overflow = '';
        }
      }

      // Close sidebar on window resize if mobile -> desktop
      window.addEventListener('resize', () => {
        if (window.innerWidth > 768 && SIDEBAR_OPEN) {
          const backdrop = document.getElementById('sidebarBackdrop');
          backdrop.classList.remove('show');
          document.body.style.overflow = '';
        } else if (window.innerWidth <= 768 && SIDEBAR_OPEN) {
          const backdrop = document.getElementById('sidebarBackdrop');
          backdrop.classList.add('show');
          document.body.style.overflow = 'hidden';
        }
      });

      // Close sidebar on ESC key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && SIDEBAR_OPEN) {
          closeResourcesSidebar();
        }
      });

     function applySelectionModeToVisibleCards() {
        const cards = document.querySelectorAll('.card[data-record-id]');

        cards.forEach((card) => {
          const recordId = String(card.getAttribute('data-record-id') || "");
          if (!recordId) return;

          let checkbox = card.querySelector('.cardCheckbox');

          // Remove any older inline click handler. Selection is bound with safe JS handlers below.
          card.removeAttribute('onclick');

          if (SELECTION_MODE) {
            card.classList.add('selectable');
            card.style.cursor = 'pointer';

            card.onclick = function(event) {
              const target = event.target;
              if (target && target.closest && target.closest('button, a, input, textarea, select')) return;
              toggleCardSelection(recordId);
            };

            if (!checkbox) {
              checkbox = document.createElement('div');
              card.prepend(checkbox);
            }

            checkbox.className = 'cardCheckbox';
            checkbox.style.display = '';
            checkbox.setAttribute('role', 'checkbox');
            checkbox.setAttribute('aria-label', 'Select demo');
            checkbox.tabIndex = 0;
            checkbox.onclick = function(event) {
              event.preventDefault();
              event.stopPropagation();
              toggleCardSelection(recordId);
            };
            checkbox.onkeydown = function(event) {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                event.stopPropagation();
                toggleCardSelection(recordId);
              }
            };

            const isSelected = SELECTED_CARDS.has(recordId);
            card.classList.toggle('selected', isSelected);
            checkbox.classList.toggle('checked', isSelected);
            checkbox.setAttribute('aria-checked', isSelected ? 'true' : 'false');
          } else {
            card.classList.remove('selectable');
            card.classList.remove('selected');
            card.onclick = function(event) {
              const target = event.target;
              if (target && target.closest && target.closest('button, a, input, textarea, select')) return;
              openMore(recordId);
            };
            card.style.cursor = 'pointer';

            if (checkbox) {
              checkbox.style.display = 'none';
              checkbox.classList.remove('checked');
              checkbox.setAttribute('aria-checked', 'false');
              checkbox.onclick = null;
              checkbox.onkeydown = null;
            }
          }

          card.querySelectorAll('button, a, input, textarea, select').forEach((el) => {
            el.style.pointerEvents = 'auto';
            if (!el.dataset.stopCardBound) {
              el.addEventListener('click', function(ev) {
                ev.stopPropagation();
              });
              el.dataset.stopCardBound = '1';
            }
          });
        });
      }

      function scheduleReloadResults(page) {
        if (window.__reloadResultsTimer) clearTimeout(window.__reloadResultsTimer);
        window.__reloadResultsTimer = setTimeout(() => reloadResults(page || 1), 120);
      }

      // Selection mode functions
      let SELECTION_LOADING = false;

      function toggleSelectionMode(){
        const fab = document.getElementById("fabMain");
        const fabLabel = document.getElementById("fabLabel");
        const fabIcon = document.getElementById("fabIcon");
        const selectionBar = document.getElementById("selectionFloatingBar");

        if (SELECTION_LOADING) return;

        SELECTION_LOADING = true;
        fab.style.pointerEvents = "none";
        fab.classList.add("loading");
        fabLabel.textContent = "Loading...";
        fabIcon.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" class="fabIcon loading-spinner">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="31.416" stroke-dashoffset="31.416">
              <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416" repeatCount="indefinite"/>
              <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416" repeatCount="indefinite"/>
            </circle>
          </svg>
        `;

        const startTime = Date.now();
        const minimumLoadingTime = 180;

        setTimeout(() => {
          SELECTION_MODE = !SELECTION_MODE;

          if (SELECTION_MODE) {
            SELECTION_BAR_HIDDEN = false;
            fab.classList.add("active");
            selectionBar.classList.add("show");
          } else {
            SELECTION_BAR_HIDDEN = false;
            fab.classList.remove("active");
            selectionBar.classList.remove("show");
            SELECTED_CARDS.clear();
          }

          updateSelectionCounter();
          applySelectionModeToVisibleCards();
          updateAllVisibleCards();

          const elapsedTime = Date.now() - startTime;
          const remainingTime = Math.max(0, minimumLoadingTime - elapsedTime);

          setTimeout(() => {
            SELECTION_LOADING = false;
            fab.classList.remove("loading");
            fab.style.pointerEvents = "auto";
            fabLabel.textContent = SELECTION_MODE ? "Exit" : "Select";
            fabIcon.innerHTML = SELECTION_MODE
              ? `<path d="M4 9h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`
              : `<path d="M4 9h10M9 4v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`;
          }, remainingTime);
        }, 30);
      }

      function toggleCardSelection(recordId) {
        recordId = String(recordId || "");
        if (!recordId) return;

        const wasSelected = SELECTED_CARDS.has(recordId);

        if (wasSelected) {
          SELECTED_CARDS.delete(recordId);
        } else {
          SELECTED_CARDS.add(recordId);
        }

        // Update the visible UI before analytics. Selection should not depend on tracking.
        updateSelectionCounter();
        updateCardVisualState(recordId);

        try {
          const record = getDiscoveryRecord(recordId) || {};
          trackEvent('card_selection', {
            recordId: recordId,
            title: record.title || 'Unknown',
            product: record.product || '',
            tdp: record.tdp || '',
            creator: record.creatorName || '',
            action: wasSelected ? 'deselect' : 'select'
          });
        } catch (error) {
          console.warn('Selection analytics failed:', error);
        }
      }

      function updateCardVisualState(recordId) {
        recordId = String(recordId || "");
        if (!recordId) return;

        const card = document.querySelector(`.card[data-record-id="${cssEscape(recordId)}"]`);
        if (!card) return;

        const isSelected = SELECTION_MODE && SELECTED_CARDS.has(recordId);
        card.classList.toggle('selected', isSelected);

        let checkbox = card.querySelector('.cardCheckbox');

        if (SELECTION_MODE && !checkbox) {
          checkbox = document.createElement('div');
          card.prepend(checkbox);
        }

        if (checkbox) {
          checkbox.className = 'cardCheckbox';
          checkbox.style.display = SELECTION_MODE ? '' : 'none';
          checkbox.classList.toggle('checked', isSelected);
          checkbox.setAttribute('role', 'checkbox');
          checkbox.setAttribute('aria-label', 'Select demo');
          checkbox.setAttribute('aria-checked', isSelected ? 'true' : 'false');
          checkbox.tabIndex = 0;
          checkbox.onclick = function(event) {
            event.preventDefault();
            event.stopPropagation();
            toggleCardSelection(recordId);
          };
          checkbox.onkeydown = function(event) {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              event.stopPropagation();
              toggleCardSelection(recordId);
            }
          };
        }
      }

      function selectAllVisible(){
        let recordIds = Array.isArray(CURRENT_PAGE_RECORD_IDS)
          ? CURRENT_PAGE_RECORD_IDS.map(String).filter(Boolean)
          : [];

        if (!recordIds.length) {
          recordIds = Array.from(document.querySelectorAll(".card[data-record-id]"))
            .map((card) => card.getAttribute("data-record-id"))
            .filter(Boolean);
        }

        recordIds.forEach((recordId) => SELECTED_CARDS.add(String(recordId)));

        updateSelectionCounter();
        updateAllVisibleCards();
      }

      function clearSelection(){
        SELECTED_CARDS.clear();
        updateSelectionCounter();
        updateAllVisibleCards();
      }

      function updateAllVisibleCards() {
        const cards = document.querySelectorAll('.card[data-record-id]');
        cards.forEach(card => {
          const recordId = card.getAttribute('data-record-id');
          if (recordId) updateCardVisualState(recordId);
        });
      }

      function getRecordIdFromCard(card) {
        return card ? card.getAttribute('data-record-id') : null;
      }

      function updateSelectionCounter() {
        const counter = document.getElementById("selectionCount");
        const count = SELECTED_CARDS.size;

        if (counter) {
          counter.textContent = `${count} selected`;
        }

        const exportSubtitle = document.getElementById("exportSubtitle");
        if (exportSubtitle) {
          exportSubtitle.textContent = `Export ${count} selected cards in your preferred format`;
        }

        const requiresItemsButtons = document.querySelectorAll(".selection-requires-items");
        requiresItemsButtons.forEach((button) => {
          button.disabled = count === 0;
        });

        const utilityButtons = document.querySelectorAll(".selection-utility");
        utilityButtons.forEach((button) => {
          button.disabled = false;
        });
      }

      function saveSelectedArcades() {
        if (SELECTED_CARDS.size === 0) {
          showWarning("Please select at least one card to save.", "Selection Required");
          return;
        }
        
        // Track save action
        trackEvent('save_selected_arcades', {
          selectedCount: SELECTED_CARDS.size,
          action: 'save_arcades'
        });
        
        // Add selected cards to saved arcades
        for (const recordId of SELECTED_CARDS) {
          SAVED_ARCADES.add(recordId);
          
          // Track individual arcade saves
          trackIndividualArcade('save_arcade', recordId, {
            action: 'save_individual',
            totalSaved: SAVED_ARCADES.size
          });
        }
        
        saveSavedArcades();
        updateSavedArcadesCounter();
        
        showSuccess(`Saved ${SELECTED_CARDS.size} demo${SELECTED_CARDS.size !== 1 ? 's' : ''} for later!`, "Saved Successfully");
        
        // Clear selection and exit selection mode
        disableSelectionMode();
      }

      // Event Links Management
      function addEventLink(title, url, date, location = '') {
        const container = document.getElementById('eventLinksContainer');
        const eventItem = document.createElement('div');
        eventItem.className = 'eventItem';
        
        const dateText = location ? `${date} • ${location}` : date;
        
        eventItem.innerHTML = `
          <a href="${escapeAttr(url)}" target="_blank" rel="noopener" class="eventLink">${escapeHtml(title)}</a>
          <div class="eventDate">${escapeHtml(dateText)}</div>
        `;
        
        container.appendChild(eventItem);
      }

      

      // Example function to update event links dynamically
      function updateEventLinks(events) {
        const container = document.getElementById('eventLinksContainer');
        container.innerHTML = '';
        
        events.forEach(event => {
          addEventLink(event.title, event.url, event.date, event.location);
        });
      }

      // Initialize application
      console.log('⭐ Starting application initialization...');
      init();
    </script>
