<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="perf-title perf-desc">
  <title id="perf-title">Performance Recommendation Engine Architecture</title>
  <desc id="perf-desc">Horizontal flow showing source data validation, signal computation, first-match recommendation rules, and output fields</desc>

  <defs>
    <style>
      .box-source { fill: #f1f3f5; stroke: #868e96; stroke-width: 2; rx: 4; }
      .box-calc { fill: #e3fafc; stroke: #0b7285; stroke-width: 2; rx: 4; }
      .box-decision { fill: #dee2e6; stroke: #343a40; stroke-width: 2.5; rx: 4; }
      .box-output { fill: #d3f9d8; stroke: #2f9e44; stroke-width: 2; rx: 4; }
      .box-metric { fill: #ffe8cc; stroke: #d9480f; stroke-width: 2; rx: 4; }
      .text-title { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #212529; }
      .text-detail { font-family: system-ui, sans-serif; font-size: 11px; fill: #495057; }
      .text-small { font-family: system-ui, sans-serif; font-size: 10px; fill: #6c757d; }
      .arrow { fill: none; stroke: #495057; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-primary { fill: none; stroke: #0b7285; stroke-width: 2.5; marker-end: url(#arrow-primary); }
      .arrow-secondary { fill: none; stroke: #d9480f; stroke-width: 1.5; marker-end: url(#arrow-sec); stroke-dasharray: 3,2; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#495057" />
    </marker>
    <marker id="arrow-primary" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0b7285" />
    </marker>
    <marker id="arrow-sec" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d9480f" />
    </marker>
  </defs>

  <!-- PRIMARY PATH -->

  <!-- Source Data -->
  <rect class="box-source" x="20" y="80" width="120" height="80" />
  <text class="text-title" x="80" y="102" text-anchor="middle">Source Data</text>
  <text class="text-small" x="80" y="118" text-anchor="middle">Request_Master</text>
  <text class="text-small" x="80" y="132" text-anchor="middle">Players, CR, MT,</text>
  <text class="text-small" x="80" y="144" text-anchor="middle">Active Months, L90,</text>
  <text class="text-small" x="80" y="156" text-anchor="middle">Page URLs, etc.</text>

  <!-- Arrow -->
  <path class="arrow-primary" d="M 140 120 L 180 120" />

  <!-- Row Validation -->
  <rect class="box-source" x="180" y="80" width="110" height="80" />
  <text class="text-title" x="235" y="102" text-anchor="middle">Row Validation</text>
  <text class="text-small" x="235" y="118" text-anchor="middle">Skip: Retired,</text>
  <text class="text-small" x="235" y="130" text-anchor="middle">Closed, blank</text>
  <text class="text-small" x="235" y="142" text-anchor="middle">Check: required</text>
  <text class="text-small" x="235" y="154" text-anchor="middle">metrics present</text>

  <!-- Arrow -->
  <path class="arrow-primary" d="M 290 120 L 330 120" />

  <!-- Performance Signals + Content Age + L90 Trend (grouped) -->
  <rect class="box-calc" x="330" y="30" width="140" height="90" />
  <text class="text-title" x="400" y="50" text-anchor="middle">Performance Signals</text>
  <text class="text-small" x="400" y="66" text-anchor="middle">Usage, CR, MT,</text>
  <text class="text-small" x="400" y="78" text-anchor="middle">Maturity, Page/Mapping,</text>
  <text class="text-small" x="400" y="90" text-anchor="middle">Recovery</text>
  <text class="text-small" x="400" y="104" text-anchor="middle" style="font-style: italic; fill: #6c757d;">+ Content Age</text>
  <text class="text-small" x="400" y="116" text-anchor="middle" style="font-style: italic; fill: #6c757d;">+ L90 Trend</text>

  <!-- Arrow to Rules -->
  <path class="arrow-primary" d="M 470 75 L 530 75" />

  <!-- First-match Rules -->
  <rect class="box-decision" x="530" y="30" width="180" height="90" />
  <text class="text-title" x="620" y="50" text-anchor="middle">First-match</text>
  <text class="text-title" x="620" y="64" text-anchor="middle">Recommendation Rules</text>
  <text class="text-small" x="620" y="80" text-anchor="middle">1. Review data linkage</text>
  <text class="text-small" x="620" y="92" text-anchor="middle">2. Improve completion</text>
  <text class="text-small" x="620" y="104" text-anchor="middle">3. Boost sales impact</text>
  <text class="text-small" x="620" y="116" text-anchor="middle">4-8. Create page, etc.</text>

  <!-- Arrow to Recommended action -->
  <path class="arrow-primary" d="M 710 75 L 760 75" />

  <!-- Recommended action + reason -->
  <rect class="box-output" x="760" y="30" width="150" height="50" />
  <text class="text-title" x="835" y="48" text-anchor="middle">Recommended action</text>
  <text class="text-small" x="835" y="62" text-anchor="middle">and</text>
  <text class="text-small" x="835" y="74" text-anchor="middle">Recommended action reason</text>

  <!-- Arrow to Assigned/Action Status -->
  <path class="arrow" d="M 910 55 L 960 55" />

  <!-- Assigned -->
  <rect class="box-output" x="960" y="30" width="90" height="30" />
  <text class="text-small" x="1005" y="48" text-anchor="middle">Assigned</text>
  <text class="text-small" x="1005" y="58" text-anchor="middle">(Creator/Admin)</text>

  <!-- Action Status -->
  <rect class="box-output" x="960" y="65" width="90" height="30" />
  <text class="text-small" x="1005" y="82" text-anchor="middle">Action Status</text>
  <text class="text-small" x="1005" y="92" text-anchor="middle">(workflow state)</text>

  <!-- SUPPORTING PATHS -->

  <!-- Source Data → Performance Flags (independent) -->
  <path class="arrow" d="M 80 160 L 80 240 L 190 240" />
  <text class="text-small" x="120" y="205" fill="#6c757d" style="font-style: italic;">independent</text>

  <!-- Performance Flags -->
  <rect class="box-metric" x="190" y="210" width="150" height="60" />
  <text class="text-title" x="265" y="230" text-anchor="middle">Performance Flags</text>
  <text class="text-small" x="265" y="245" text-anchor="middle">Multiple diagnostic labels:</text>
  <text class="text-small" x="265" y="257" text-anchor="middle">High usage, Low completion,</text>
  <text class="text-small" x="265" y="267" text-anchor="middle">High business impact, etc.</text>

  <!-- Signals → Score → Tier -->
  <path class="arrow" d="M 400 120 L 400 310 L 460 310" />

  <!-- Performance Score -->
  <rect class="box-metric" x="460" y="280" width="130" height="60" />
  <text class="text-title" x="525" y="300" text-anchor="middle">Performance Score</text>
  <text class="text-small" x="525" y="314" text-anchor="middle">(0-100)</text>
  <text class="text-small" x="525" y="326" text-anchor="middle">Signals + Trend +</text>
  <text class="text-small" x="525" y="336" text-anchor="middle">Maturity</text>

  <!-- Arrow Score → Tier -->
  <path class="arrow" d="M 590 310 L 630 310" />

  <!-- Performance Tier -->
  <rect class="box-metric" x="630" y="280" width="130" height="60" />
  <text class="text-title" x="695" y="300" text-anchor="middle">Performance Tier</text>
  <text class="text-small" x="695" y="316" text-anchor="middle">Top / Mid / Low /</text>
  <text class="text-small" x="695" y="328" text-anchor="middle">Inactive</text>

  <!-- Action Priority calculation -->
  <rect class="box-output" x="760" y="140" width="150" height="80" />
  <text class="text-title" x="835" y="160" text-anchor="middle">Action Priority</text>
  <text class="text-small" x="835" y="176" text-anchor="middle">Signals + Content Age +</text>
  <text class="text-small" x="835" y="188" text-anchor="middle">L90 Trend +</text>
  <text class="text-small" x="835" y="200" text-anchor="middle">Recommended action</text>
  <text class="text-small" x="835" y="212" text-anchor="middle">→ High / Medium / Low</text>

  <!-- Arrows feeding Action Priority -->
  <path class="arrow" d="M 400 120 L 400 180 L 760 180" />
  <text class="text-small" x="560" y="176" fill="#6c757d" style="font-style: italic;">Signals + Age + Trend</text>

  <path class="arrow" d="M 835 80 L 835 140" />
  <text class="text-small" x="845" y="110" fill="#6c757d" style="font-style: italic;">action</text>

  <!-- Tier cap arrow -->
  <path class="arrow-secondary" d="M 695 280 L 695 220 L 835 220" />
  <text class="text-small" x="745" y="216" fill="#d9480f" style="font-style: italic;">cap: Low tier → Medium max</text>

  <!-- Processing Result -->
  <rect class="box-source" x="180" y="210" width="150" height="40" />
  <text class="text-title" x="255" y="228" text-anchor="middle">Processing Result</text>
  <text class="text-small" x="255" y="242" text-anchor="middle">Processed / Skipped / Needs review</text>

  <!-- Legend -->
  <text class="text-title" x="20" y="400" text-anchor="start">Legend:</text>

  <rect class="box-source" x="20" y="410" width="30" height="18" />
  <text class="text-small" x="58" y="423" text-anchor="start">Source & Validation</text>

  <rect class="box-calc" x="180" y="410" width="30" height="18" />
  <text class="text-small" x="218" y="423" text-anchor="start">Calculated Fields</text>

  <rect class="box-decision" x="340" y="410" width="30" height="18" />
  <text class="text-small" x="378" y="423" text-anchor="start">Decision Logic</text>

  <rect class="box-output" x="500" y="410" width="30" height="18" />
  <text class="text-small" x="538" y="423" text-anchor="start">Recommendation & Workflow Outputs</text>

  <rect class="box-metric" x="740" y="410" width="30" height="18" />
  <text class="text-small" x="778" y="423" text-anchor="start">Performance Metrics</text>

  <!-- Notes -->
  <text class="text-small" x="20" y="460" text-anchor="start">Notes:</text>
  <text class="text-small" x="20" y="478" text-anchor="start">• Rules evaluate Performance Signals (including Content Age and L90 Trend), not Performance Flags</text>
  <text class="text-small" x="20" y="494" text-anchor="start">• Performance Flags calculated independently from source metrics for diagnostic use</text>
  <text class="text-small" x="20" y="510" text-anchor="start">• Action Priority: initial calculation from Signals/Age/Trend/action, then Tier-based cap applied in classifyRow_()</text>
  <text class="text-small" x="20" y="526" text-anchor="start">• Performance Score and Tier support prioritization and diagnostics</text>

  <!-- Footer -->
  <text class="text-small" x="700" y="680" text-anchor="middle" fill="#868e96">Source: RM_Performance.js | Request_Master columns auto-created</text>
</svg>
