<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcade Lifecycle Dashboard</title>
    <link rel="icon" type="image/x-icon" href="https://www.redhat.com/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;600;700&family=Red+Hat+Text:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg: #f6f7fb;
        --surface: #ffffff;
        --ink: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --shadow: 0 8px 24px rgba(0,0,0,.06);
        --accent: #6d28d9;
        --accent2: #ede9fe;
        --promote: #059669;
        --promote-bg: #ecfdf5;
        --refresh: #d97706;
        --refresh-bg: #fffbeb;
        --retire: #dc2626;
        --retire-bg: #fef2f2;
        --review: #7c3aed;
        --review-bg: #f5f3ff;
        --keep: #6b7280;
        --keep-bg: #f3f4f6;
        --trend-up: #059669;
        --trend-down: #dc2626;
        --trend-flat: #6b7280;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827; --surface: #1f2937; --ink: #f3f4f6; --muted: #9ca3af;
          --border: #374151; --shadow: 0 8px 24px rgba(0,0,0,.25);
          --accent: #8b5cf6; --accent2: #2e1065;
          --promote: #34d399; --promote-bg: #064e3b;
          --refresh: #fbbf24; --refresh-bg: #78350f;
          --retire: #f87171; --retire-bg: #7f1d1d;
          --review: #a78bfa; --review-bg: #4c1d95;
          --keep: #9ca3af; --keep-bg: #374151;
        }
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Red Hat Text', sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }

      .header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .header h1 {
        font-family: 'Red Hat Display', sans-serif;
        font-size: 20px;
        font-weight: 700;
      }
      .header-meta {
        font-size: 12px;
        color: var(--muted);
      }

      .tabs {
        display: flex;
        gap: 4px;
        background: var(--bg);
        border-radius: 8px;
        padding: 3px;
      }
      .tab {
        padding: 8px 20px;
        border-radius: 6px;
        border: none;
        background: none;
        font-family: 'Red Hat Text', sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.15s;
      }
      .tab:hover { color: var(--ink); }
      .tab.active {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 1px 3px rgba(0,0,0,.08);
      }

      .main { max-width: 1280px; margin: 0 auto; padding: 24px; }

      .view { display: none; }
      .view.active { display: block; }

      /* Stat cards */
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow);
      }
      .stat-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .stat-value {
        font-family: 'Red Hat Display', sans-serif;
        font-size: 28px;
        font-weight: 700;
      }
      .stat-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }

      /* Action badges */
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge-promote { background: var(--promote-bg); color: var(--promote); }
      .badge-refresh { background: var(--refresh-bg); color: var(--refresh); }
      .badge-retire { background: var(--retire-bg); color: var(--retire); }
      .badge-review { background: var(--review-bg); color: var(--review); }
      .badge-keep { background: var(--keep-bg); color: var(--keep); }

      /* Trend arrows */
      .trend-up { color: var(--trend-up); font-weight: 700; }
      .trend-down { color: var(--trend-down); font-weight: 700; }
      .trend-flat { color: var(--trend-flat); }

      /* Action summary bar */
      .action-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .action-stat {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .action-stat:hover { border-color: var(--accent); }
      .action-stat.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent2); }
      .action-count {
        font-family: 'Red Hat Display', sans-serif;
        font-size: 20px;
        font-weight: 700;
      }
      .action-label { font-size: 13px; color: var(--muted); }

      /* Tables */
      .table-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shadow);
        margin-bottom: 24px;
      }
      .table-title {
        font-family: 'Red Hat Display', sans-serif;
        font-size: 16px;
        font-weight: 700;
        padding: 16px 20px 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        padding: 10px 14px;
        border-bottom: 2px solid var(--border);
        font-weight: 600;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      th:hover { color: var(--ink); }
      th .sort-icon { margin-left: 4px; font-size: 10px; }
      td {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: var(--bg); }
      .td-title {
        font-weight: 600;
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .td-num { text-align: right; font-variant-numeric: tabular-nums; }

      /* Expandable detail row */
      .detail-row td {
        padding: 0;
        background: var(--bg);
      }
      .detail-content {
        padding: 16px 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .detail-section h4 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .detail-section p {
        font-size: 13px;
        margin-bottom: 6px;
      }
      .detail-section .label { color: var(--muted); }

      /* Filter bar */
      .filter-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        align-items: center;
      }
      .filter-bar select, .filter-bar input {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: 'Red Hat Text', sans-serif;
        font-size: 13px;
        background: var(--surface);
        color: var(--ink);
        min-width: 140px;
      }
      .filter-bar input { min-width: 220px; }
      .filter-bar select:focus, .filter-bar input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent2);
      }
      .filter-count {
        font-size: 13px;
        color: var(--muted);
        margin-left: auto;
      }

      /* Team selector */
      .team-selector {
        margin-bottom: 24px;
      }
      .team-selector select {
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: 'Red Hat Text', sans-serif;
        font-size: 14px;
        font-weight: 600;
        background: var(--surface);
        color: var(--ink);
        min-width: 280px;
      }

      /* Comparison cards */
      .compare-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .compare-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
      }
      .compare-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      .compare-values { display: flex; align-items: baseline; gap: 8px; }
      .compare-team {
        font-family: 'Red Hat Display', sans-serif;
        font-size: 22px;
        font-weight: 700;
      }
      .compare-portfolio {
        font-size: 13px;
        color: var(--muted);
      }

      /* Top/Bottom lists */
      .top-bottom-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
      }
      @media (max-width: 768px) {
        .top-bottom-grid { grid-template-columns: 1fr; }
        .detail-content { grid-template-columns: 1fr; }
      }
      .ranked-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
      }
      .ranked-item:last-child { border-bottom: none; }
      .rank-num {
        font-family: 'Red Hat Display', sans-serif;
        font-size: 16px;
        font-weight: 700;
        color: var(--muted);
        min-width: 24px;
      }
      .rank-info { flex: 1; min-width: 0; }
      .rank-title {
        font-weight: 600;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rank-meta { font-size: 11px; color: var(--muted); }
      .rank-score {
        font-family: 'Red Hat Display', sans-serif;
        font-size: 16px;
        font-weight: 700;
      }

      /* Loading */
      .loading {
        text-align: center;
        padding: 80px 24px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loading-text { color: var(--muted); font-size: 14px; }

      .empty-state {
        text-align: center;
        padding: 60px 24px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div>
        <h1>Arcade Lifecycle Dashboard</h1>
        <div class="header-meta" id="lastUpdated"></div>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('portfolio')">Portfolio</button>
        <button class="tab" onclick="switchTab('admin')">Admin</button>
        <button class="tab" onclick="switchTab('team')">Team</button>
      </div>
    </div>

    <div class="main">
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading lifecycle data...</div>
      </div>

      <!-- PORTFOLIO VIEW -->
      <div id="view-portfolio" class="view">
        <div class="action-bar" id="portfolio-actions"></div>
        <div class="stat-grid" id="portfolio-stats"></div>

        <div class="table-wrap">
          <div class="table-title">TDP Breakdown</div>
          <table>
            <thead><tr>
              <th>TDP</th>
              <th class="td-num">Demos</th>
              <th class="td-num">Avg Quality</th>
              <th class="td-num">Total Players YTD</th>
              <th>Promote</th>
              <th>Refresh</th>
              <th>Retire</th>
              <th>Review</th>
            </tr></thead>
            <tbody id="tdp-table-body"></tbody>
          </table>
        </div>

        <div class="top-bottom-grid">
          <div class="table-wrap">
            <div class="table-title">Top 10 — Highest Lifecycle Score</div>
            <div id="top-list"></div>
          </div>
          <div class="table-wrap">
            <div class="table-title">Bottom 10 — Needs Attention</div>
            <div id="bottom-list"></div>
          </div>
        </div>
      </div>

      <!-- ADMIN VIEW -->
      <div id="view-admin" class="view">
        <div class="filter-bar">
          <select id="filter-tdp" onchange="applyFilters()">
            <option value="">All TDPs</option>
          </select>
          <select id="filter-team" onchange="applyFilters()">
            <option value="">All Teams</option>
          </select>
          <select id="filter-action" onchange="applyFilters()">
            <option value="">All Actions</option>
            <option value="Promote">Promote</option>
            <option value="Refresh">Refresh</option>
            <option value="Retire">Retire</option>
            <option value="Review">Review</option>
            <option value="Keep">Keep</option>
          </select>
          <input type="text" id="filter-search" placeholder="Search demos..." oninput="applyFilters()">
          <span class="filter-count" id="filter-count"></span>
        </div>

        <div class="table-wrap">
          <table>
            <thead><tr>
              <th onclick="sortAdmin('title')">Demo <span class="sort-icon"></span></th>
              <th onclick="sortAdmin('tdp')">TDP <span class="sort-icon"></span></th>
              <th onclick="sortAdmin('team')">Team <span class="sort-icon"></span></th>
              <th onclick="sortAdmin('quality')" class="td-num">Quality <span class="sort-icon"></span></th>
              <th onclick="sortAdmin('playersYtd')" class="td-num">Players YTD <span class="sort-icon"></span></th>
              <th onclick="sortAdmin('playersTrend')">Trend <span class="sort-icon"></span></th>
              <th onclick="sortAdmin('lifecycleScore')" class="td-num">Score <span class="sort-icon"></span></th>
              <th onclick="sortAdmin('action')">Action <span class="sort-icon"></span></th>
            </tr></thead>
            <tbody id="admin-table-body"></tbody>
          </table>
        </div>
      </div>

      <!-- TEAM VIEW -->
      <div id="view-team" class="view">
        <div class="team-selector">
          <select id="team-select" onchange="renderTeamView()">
            <option value="">Select a team...</option>
          </select>
        </div>
        <div id="team-content"></div>
      </div>
    </div>

    <script>
      var DATA = null;
      var adminSort = { col: 'lifecycleScore', asc: false };
      var expandedRow = null;

      google.script.run
        .withSuccessHandler(function(data) {
          DATA = data;
          document.getElementById('loading').style.display = 'none';
          if (data.lastUpdated) {
            var d = new Date(data.lastUpdated);
            document.getElementById('lastUpdated').textContent = 'Last updated: ' + d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
          }
          renderPortfolio();
          renderAdmin();
          populateTeamSelector();
          document.getElementById('view-portfolio').classList.add('active');
        })
        .withFailureHandler(function(err) {
          document.getElementById('loading').innerHTML =
            '<div style="color:var(--retire)">Failed to load data: ' + err.message + '</div>';
        })
        .getDashboardData();

      function switchTab(name) {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
        event.target.classList.add('active');
        document.getElementById('view-' + name).classList.add('active');
      }

      function badgeHtml(action) {
        var cls = 'badge-' + action.toLowerCase();
        return '<span class="badge ' + cls + '">' + action + '</span>';
      }

      function trendHtml(arrow) {
        if (arrow === '↑') return '<span class="trend-up">↑</span>';
        if (arrow === '↓') return '<span class="trend-down">↓</span>';
        return '<span class="trend-flat">→</span>';
      }

      function fmt(n) {
        if (n === null || n === undefined || isNaN(n)) return '—';
        return Number(n).toLocaleString();
      }

      function fmtDollar(n) {
        if (!n) return '—';
        return '$' + Number(n).toLocaleString();
      }

      /* ==================
         PORTFOLIO VIEW
      ================== */
      function renderPortfolio() {
        if (!DATA) return;
        var s = DATA.actionSummary;
        var total = DATA.demos.length;

        var actionsHtml = '';
        ['Promote', 'Keep', 'Refresh', 'Review', 'Retire'].forEach(function(a) {
          actionsHtml += '<div class="action-stat">' +
            badgeHtml(a) +
            '<span class="action-count">' + (s[a] || 0) + '</span>' +
            '</div>';
        });
        document.getElementById('portfolio-actions').innerHTML = actionsHtml;

        var totalPlayers = DATA.demos.reduce(function(sum, d) { return sum + (d.playersYtd || 0); }, 0);
        var qualDemos = DATA.demos.filter(function(d) { return d.quality !== null; });
        var avgQuality = qualDemos.length > 0 ? Math.round(qualDemos.reduce(function(s, d) { return s + d.quality; }, 0) / qualDemos.length) : '—';
        var needsAction = (s.Refresh || 0) + (s.Retire || 0) + (s.Review || 0);

        document.getElementById('portfolio-stats').innerHTML =
          statCard('Total Demos', total, 'Published or reviewed') +
          statCard('Avg Quality', avgQuality + '/100', qualDemos.length + ' demos scored') +
          statCard('Total Players YTD', fmt(totalPlayers), 'Across portfolio') +
          statCard('Needs Action', needsAction, 'Refresh + Retire + Review');

        // TDP table
        var tdpKeys = Object.keys(DATA.tdpSummary).sort();
        var tbody = '';
        tdpKeys.forEach(function(tdp) {
          var t = DATA.tdpSummary[tdp];
          tbody += '<tr>' +
            '<td style="font-weight:600">' + esc(tdp) + '</td>' +
            '<td class="td-num">' + t.count + '</td>' +
            '<td class="td-num">' + (t.avgQuality !== null ? t.avgQuality + '/100' : '—') + '</td>' +
            '<td class="td-num">' + fmt(t.totalPlayers) + '</td>' +
            '<td>' + (t.actions.Promote ? badgeHtml('Promote') + ' ' + t.actions.Promote : '—') + '</td>' +
            '<td>' + (t.actions.Refresh ? badgeHtml('Refresh') + ' ' + t.actions.Refresh : '—') + '</td>' +
            '<td>' + (t.actions.Retire ? badgeHtml('Retire') + ' ' + t.actions.Retire : '—') + '</td>' +
            '<td>' + (t.actions.Review ? badgeHtml('Review') + ' ' + t.actions.Review : '—') + '</td>' +
            '</tr>';
        });
        document.getElementById('tdp-table-body').innerHTML = tbody;

        // Top/Bottom lists
        var sorted = DATA.demos.slice().sort(function(a, b) { return b.lifecycleScore - a.lifecycleScore; });
        var top10 = sorted.slice(0, 10);
        var bottom10 = sorted.slice(-10).reverse();

        document.getElementById('top-list').innerHTML = rankedList(top10, true);
        document.getElementById('bottom-list').innerHTML = rankedList(bottom10, false);
      }

      function statCard(label, value, sub) {
        return '<div class="stat-card">' +
          '<div class="stat-label">' + label + '</div>' +
          '<div class="stat-value">' + value + '</div>' +
          '<div class="stat-sub">' + sub + '</div>' +
          '</div>';
      }

      function rankedList(items, isTop) {
        return items.map(function(d, i) {
          return '<div class="ranked-item">' +
            '<span class="rank-num">' + (i + 1) + '</span>' +
            '<div class="rank-info">' +
              '<div class="rank-title">' + esc(d.title) + '</div>' +
              '<div class="rank-meta">' + esc(d.tdp) + ' · ' + esc(d.team) + ' · ' + badgeHtml(d.action) + '</div>' +
            '</div>' +
            '<span class="rank-score" style="color:' + (isTop ? 'var(--promote)' : 'var(--retire)') + '">' + d.lifecycleScore + '</span>' +
            '</div>';
        }).join('');
      }

      /* ==================
         ADMIN VIEW
      ================== */
      function renderAdmin() {
        if (!DATA) return;
        populateFilterOptions();
        applyFilters();
      }

      function populateFilterOptions() {
        var tdps = {};
        var teams = {};
        DATA.demos.forEach(function(d) {
          tdps[d.tdp] = true;
          teams[d.team] = true;
        });

        var tdpSelect = document.getElementById('filter-tdp');
        Object.keys(tdps).sort().forEach(function(t) {
          var opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          tdpSelect.appendChild(opt);
        });

        var teamSelect = document.getElementById('filter-team');
        Object.keys(teams).sort().forEach(function(t) {
          var opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          teamSelect.appendChild(opt);
        });
      }

      function applyFilters() {
        var tdp = document.getElementById('filter-tdp').value;
        var team = document.getElementById('filter-team').value;
        var action = document.getElementById('filter-action').value;
        var search = document.getElementById('filter-search').value.toLowerCase();

        var filtered = DATA.demos.filter(function(d) {
          if (tdp && d.tdp !== tdp) return false;
          if (team && d.team !== team) return false;
          if (action && d.action !== action) return false;
          if (search && d.title.toLowerCase().indexOf(search) === -1 && d.product.toLowerCase().indexOf(search) === -1) return false;
          return true;
        });

        filtered.sort(function(a, b) {
          var av = a[adminSort.col], bv = b[adminSort.col];
          if (typeof av === 'string') av = av.toLowerCase();
          if (typeof bv === 'string') bv = bv.toLowerCase();
          if (av < bv) return adminSort.asc ? -1 : 1;
          if (av > bv) return adminSort.asc ? 1 : -1;
          return 0;
        });

        document.getElementById('filter-count').textContent = filtered.length + ' of ' + DATA.demos.length + ' demos';
        renderAdminTable(filtered);
      }

      function sortAdmin(col) {
        if (adminSort.col === col) {
          adminSort.asc = !adminSort.asc;
        } else {
          adminSort.col = col;
          adminSort.asc = col === 'title' || col === 'tdp' || col === 'team';
        }
        applyFilters();
      }

      function renderAdminTable(demos) {
        expandedRow = null;
        var tbody = '';
        demos.forEach(function(d, idx) {
          tbody += '<tr onclick="toggleDetail(' + idx + ', this)" style="cursor:pointer">' +
            '<td class="td-title" title="' + esc(d.title) + '">' + esc(d.title) + '</td>' +
            '<td>' + esc(d.tdp) + '</td>' +
            '<td>' + esc(d.team) + '</td>' +
            '<td class="td-num">' + (d.quality !== null ? d.quality + '/100' : '—') + '</td>' +
            '<td class="td-num">' + fmt(d.playersYtd) + '</td>' +
            '<td>' + trendHtml(d.playersTrend) + '</td>' +
            '<td class="td-num" style="font-weight:700">' + d.lifecycleScore + '</td>' +
            '<td>' + badgeHtml(d.action) + '</td>' +
            '</tr>';
        });
        document.getElementById('admin-table-body').innerHTML = tbody;
        window._filteredDemos = demos;
      }

      function toggleDetail(idx, row) {
        var existing = row.nextElementSibling;
        if (existing && existing.classList.contains('detail-row')) {
          existing.remove();
          expandedRow = null;
          return;
        }

        var prev = document.querySelector('.detail-row');
        if (prev) prev.remove();

        var d = window._filteredDemos[idx];
        var detailTr = document.createElement('tr');
        detailTr.className = 'detail-row';
        detailTr.innerHTML = '<td colspan="8"><div class="detail-content">' +
          '<div class="detail-section">' +
            '<h4>Lifecycle Decision</h4>' +
            '<p>' + badgeHtml(d.action) + ' <strong>Score: ' + d.lifecycleScore + '/100</strong></p>' +
            '<p>' + esc(d.lifecycleReason) + '</p>' +
            '<h4 style="margin-top:12px">Content Quality</h4>' +
            '<p>' + esc(d.qualityNote || 'Not scored') + '</p>' +
            (d.note ? '<p style="color:var(--muted);font-size:12px">' + esc(d.note) + '</p>' : '') +
          '</div>' +
          '<div class="detail-section">' +
            '<h4>YTD Engagement</h4>' +
            '<p><span class="label">Players:</span> ' + fmt(d.playersYtd) + ' ' + trendHtml(d.playersTrend) + '</p>' +
            '<p><span class="label">Completion Rate:</span> ' + (d.completionRate ? (d.completionRate + '%') : '—') + ' ' + trendHtml(d.completionTrend) + '</p>' +
            '<p><span class="label">CTA Clicks:</span> ' + fmt(d.ctaClicksYtd) + '</p>' +
            '<p><span class="label">UVs:</span> ' + fmt(d.uvsYtd) + '</p>' +
            '<h4 style="margin-top:12px">Sales Impact YTD</h4>' +
            '<p><span class="label">Inquiries:</span> ' + fmt(d.inquiriesYtd) + ' · <span class="label">Opps:</span> ' + fmt(d.oppsYtd) + ' (' + fmtDollar(d.oppValueYtd) + ')</p>' +
            '<p><span class="label">Wins:</span> ' + fmt(d.winsYtd) + ' (' + fmtDollar(d.wonValueYtd) + ')</p>' +
            (d.overlapNote ? '<h4 style="margin-top:12px">Content Overlap</h4><p>' + esc(d.overlapNote) + '</p>' : '') +
          '</div>' +
          '</div></td>';
        row.parentNode.insertBefore(detailTr, row.nextSibling);
        expandedRow = idx;
      }

      /* ==================
         TEAM VIEW
      ================== */
      function populateTeamSelector() {
        var select = document.getElementById('team-select');
        Object.keys(DATA.teamSummary).sort().forEach(function(t) {
          var opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t + ' (' + DATA.teamSummary[t].count + ' demos)';
          select.appendChild(opt);
        });
      }

      function renderTeamView() {
        var team = document.getElementById('team-select').value;
        var content = document.getElementById('team-content');
        if (!team) { content.innerHTML = ''; return; }

        var ts = DATA.teamSummary[team];
        var portfolioAvgQuality = 0, portfolioCount = 0;
        DATA.demos.forEach(function(d) {
          if (d.quality !== null) { portfolioAvgQuality += d.quality; portfolioCount++; }
        });
        portfolioAvgQuality = portfolioCount > 0 ? Math.round(portfolioAvgQuality / portfolioCount) : 0;
        var portfolioAvgPlayers = DATA.demos.length > 0
          ? Math.round(DATA.demos.reduce(function(s, d) { return s + d.playersYtd; }, 0) / DATA.demos.length)
          : 0;

        var html = '<div class="compare-grid">' +
          compareCard('Demos', ts.count, DATA.demos.length + ' total') +
          compareCard('Avg Quality', (ts.avgQuality !== null ? ts.avgQuality : '—') + '/100', portfolioAvgQuality + '/100 portfolio') +
          compareCard('Avg Players YTD', fmt(ts.avgPlayers), fmt(portfolioAvgPlayers) + ' portfolio') +
          compareCard('Needs Action', (ts.actions.Refresh + ts.actions.Retire + ts.actions.Review), 'Refresh + Retire + Review') +
          '</div>';

        html += '<div class="action-bar">';
        ['Promote', 'Keep', 'Refresh', 'Review', 'Retire'].forEach(function(a) {
          html += '<div class="action-stat">' + badgeHtml(a) +
            '<span class="action-count">' + (ts.actions[a] || 0) + '</span></div>';
        });
        html += '</div>';

        var teamDemos = DATA.demos.filter(function(d) { return d.team === team; })
          .sort(function(a, b) { return b.lifecycleScore - a.lifecycleScore; });

        html += '<div class="table-wrap"><table>' +
          '<thead><tr>' +
            '<th>Demo</th><th>TDP</th><th class="td-num">Quality</th>' +
            '<th class="td-num">Players YTD</th><th>Trend</th>' +
            '<th class="td-num">Score</th><th>Action</th><th>Reason</th>' +
          '</tr></thead><tbody>';

        teamDemos.forEach(function(d) {
          html += '<tr>' +
            '<td class="td-title" title="' + esc(d.title) + '">' + esc(d.title) + '</td>' +
            '<td>' + esc(d.tdp) + '</td>' +
            '<td class="td-num">' + (d.quality !== null ? d.quality + '/100' : '—') + '</td>' +
            '<td class="td-num">' + fmt(d.playersYtd) + '</td>' +
            '<td>' + trendHtml(d.playersTrend) + '</td>' +
            '<td class="td-num" style="font-weight:700">' + d.lifecycleScore + '</td>' +
            '<td>' + badgeHtml(d.action) + '</td>' +
            '<td style="font-size:12px;color:var(--muted);max-width:250px">' + esc(d.lifecycleReason) + '</td>' +
            '</tr>';
        });

        html += '</tbody></table></div>';
        content.innerHTML = html;
      }

      function compareCard(label, teamVal, portfolioVal) {
        return '<div class="compare-card">' +
          '<div class="compare-label">' + label + '</div>' +
          '<div class="compare-values">' +
            '<span class="compare-team">' + teamVal + '</span>' +
            '<span class="compare-portfolio">vs ' + portfolioVal + '</span>' +
          '</div></div>';
      }

      function esc(s) {
        if (!s) return '';
        var div = document.createElement('div');
        div.textContent = String(s);
        return div.innerHTML;
      }
    </script>
  </body>
</html>
